        function shareRecipe(id) {
            const recipe = state.recipes.find(r => r.id === id);
            if (!recipe) return;
            const text = `${recipe.title}\n\nIngrédients:\n${recipe.ingredients.map(i => `- ${i.amount || ''} ${i.unit || ''} ${i.name}`).join('\n')}\n\nPréparation:\n${recipe.steps.map((s, i) => `${i+1}. ${s}`).join('\n')}`;
            if (navigator.share) {
                navigator.share({ title: recipe.title, text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 Recette copiée dans le presse-papiers', 'success');
                }).catch(() => {
                    showToast('📋 ' + text.substring(0, 200) + '...', 'info');
                });
            }
        }

        function exportRecipe(id) {
            const recipe = state.recipes.find(r => r.id === id);
            if (!recipe) return;
            const blob = new Blob([JSON.stringify(recipe, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${recipe.title.replace(/\s+/g, '_')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📦 Recette exportée', 'success');
        }

        // ============================================================
        //  23. NAVIGATION
        // ============================================================
        function navigate(page, data) {
            // Fermer le modal si ouvert
            overlay.classList.remove('active');
            // Fermer le mode cuisine
            document.getElementById('cookMode').classList.remove('active');

            // Si on navigue vers une vue de recette, stocker
            if (page === 'view' && data) {
                render('view', data);
            } else if (page === 'edit' && data) {
                render('edit', data);
            } else if (page === 'add') {
                render('add', {});
            } else if (page === 'favorites') {
                render('favorites');
            } else if (page === 'settings') {
                render('settings');
            } else if (page === 'recipes') {
                render('recipes');
            } else if (page === 'search') {
                render('search');
            } else if (page === 'categories') {
                render('categories');
            } else if (page === 'grocery') {
                render('grocery');
            } else {
                render('home');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  24. TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        //  25. LOAD DATA
        // ============================================================
        async function loadData() {
            try {
                const recipes = await dbGetAll('recipes');
                state.recipes = recipes || [];

                let cats = await dbGetAll('categories');
                if (!cats || cats.length === 0) {
                    // Initialiser avec les catégories par défaut
                    const defs = getDefaultCategories();
                    for (const c of defs) await dbPut('categories', c);
                    cats = await dbGetAll('categories');
                }
                state.categories = cats || [];

                const settings = await dbGet('settings', 'settings');
                state.settings = settings || getDefaultSettings();
                if (!settings) {
                    await dbPut('settings', { key: 'settings', ...getDefaultSettings() });
                }

                const grocery = await dbGetAll('grocery');
                state.grocery = grocery || [];

                // Appliquer les paramètres
                applySettings();

            } catch (err) {
                console.error('Erreur chargement données:', err);
                state.recipes = [];
                state.categories = getDefaultCategories();
                state.settings = getDefaultSettings();
                state.grocery = [];
            }
        }

        // ============================================================
        //  26. INIT
        // ============================================================
        async function init() {
            await loadData();

            // Navigation events
            document.querySelectorAll('[data-page]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = el.dataset.page;
                    if (page === 'add') {
                        openAddModal('manual');
                    } else {
                        navigate(page);
                    }
                });
            });

            // Keyboard shortcuts - Escape ferme le modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    overlay.classList.remove('active');
                    document.getElementById('cookMode').classList.remove('active');
                }
            });

            // Render home
            navigate('home');

            // Service Worker registration (PWA)
            if ('serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    console.log('SW registered:', reg);
                } catch (e) {
                    console.log('SW registration skipped:', e);
                }
            }

            console.log('🍽️ TastyVault prêt !');
        }

        // Démarrer
        document.addEventListener('DOMContentLoaded', init);

        // Exposer globalement pour les appels HTML
        window.navigate = navigate;
        window.openAddModal = openAddModal;
        window.openEditRecipe = openEditRecipe;
        window.deleteRecipe = deleteRecipe;
        window.toggleFavorite = toggleFavorite;
        window.adjustServings = adjustServings;
        window.addToGrocery = addToGrocery;
        window.addManualGroceryItem = addManualGroceryItem;
        window.toggleGroceryItem = toggleGroceryItem;
        window.removeGroceryItem = removeGroceryItem;
        window.clearGrocery = clearGrocery;
        window.openCookMode = openCookMode;
        window.closeCookMode = closeCookMode;
        window.cookNext = cookNext;
        window.cookPrev = cookPrev;
        window.doSearch = doSearch;
        window.addCategory = addCategory;
        window.editCategory = editCategory;
        window.deleteCategory = deleteCategory;
        window.exportAllData = exportAllData;
        window.importAllData = importAllData;
        window.clearAllData = clearAllData;
        window.shareRecipe = shareRecipe;
        window.exportRecipe = exportRecipe;
        window.showToast = showToast;
        window.addIngredientField = addIngredientField;
        window.addStepField = addStepField;
        window.saveRecipe = saveRecipe;
        window.updateSetting = updateSetting;
        window.renderGrocery = renderGrocery;
        window.loadData = loadData;
    </script>
</body>
</html>
